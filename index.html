<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Wild Goose Chase</title>
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <style>
    :root {
      --navy: #0e1726;
      --slate: #182538;
      --cyan: #22d3ee;
      --amber: #ffb43a;
      --gold: #ffd94d;
      --cream: #fff5df;
      --red: #ef4444;
      --green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    html, body, #app {
      position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh;
      overflow: hidden; overscroll-behavior: none;
      background: #141c28; font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', system-ui, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: fixed; inset: 0; pointer-events: none; padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }

    /* =====================================================================
       AAA SUPERMARKET ARCADE HUD (Matched to Martin's Artist Impression!)
       ===================================================================== */
    #topleftbar {
      position: fixed; left: max(14px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top));
      display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
      pointer-events: none; z-index: 20;
    }
    .tl-row { display: flex; align-items: center; gap: 9px; pointer-events: auto; }

    #pausebtn {
      width: 46px; height: 42px; border-radius: 14px;
      background: linear-gradient(180deg, #274c7e 0%, #122848 56%, #0c1b33 100%);
      border: 2.5px solid #081222;
      box-shadow: 0 4px 0 #081222, 0 7px 14px rgba(0,0,0,.32), inset 0 2px 0 rgba(255,255,255,.35);
      color: #fff; cursor: pointer; display: grid; place-items: center;
      transition: transform .1s ease;
    }
    #pausebtn:active { transform: translateY(2px); box-shadow: 0 2px 0 #081222; }
    #pausebtn svg { width: 17px; height: 17px; fill: #fff; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }

    #levelpill {
      height: 42px; padding: 0 20px; border-radius: 11px;
      background: linear-gradient(180deg, #d8ff36 0%, #a3e600 58%, #7fc400 100%);
      border: 2.5px solid #0b1628;
      box-shadow: 0 4px 0 #0b1628, 0 7px 14px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.65);
      transform: skewX(-10deg);
      display: flex; align-items: center; justify-content: center;
      font-family: Impact, 'Arial Narrow', Arial, sans-serif;
      font-size: 21px; letter-spacing: 1px; color: #0b1628;
    }

    /* Spiral-bound Orange-Header Clipboard Shopping List (Artist Impression!) */
    #listticket {
      position: relative; width: 152px;
      background: #ffffff;
      border: 3px solid #0e1e36; border-radius: 12px;
      box-shadow: 0 5px 0 #0e1e36, 0 12px 24px rgba(8,18,34,.32);
      transform: rotate(-1.5deg);
      overflow: visible;
      pointer-events: auto;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    /* Slim side-guide mode (auto-collapses after level starts on mobile; tap anytime to toggle!) */
    #listticket.compact {
      width: 66px;
      transform: rotate(0deg);
      border-width: 2.5px;
      box-shadow: 0 4px 0 #0e1e36, 0 8px 18px rgba(8,18,34,.28);
    }
    #listticket.compact .ticket-clip { width: 26px; height: 10px; top: -8px; border-width: 2px; }
    #listticket.compact .ticket-clip::after { width: 10px; height: 6px; top: -5px; border-width: 2px; }
    #listticket.compact .ticket-head { padding: 4px 4px 6px; font-size: 0; gap: 0; min-height: 18px; }
    #listticket.compact .ticket-head span { display: none; }
    #listticket.compact .ticket-rings { left: 5px; right: 5px; bottom: -5px; }
    #listticket.compact .ticket-rings i { width: 5px; height: 8px; }
    #listticket.compact .ticket-rings i:nth-child(n+5) { display: none; }
    #listticket.compact #listbar { padding: 8px 5px 6px; gap: 4px; }
    #listticket.compact .chip { justify-content: space-between; gap: 3px; padding: 1px 2px; }
    #listticket.compact .chip-name { display: none; }
    #listticket.compact .chip-ico { width: 22px; height: 22px; }
    #listticket.compact .chip-ico-img { width: 22px; height: 22px; }
    #listticket.compact .chip-check { width: 18px; height: 18px; }
    #listticket.compact #ticketcta {
      font-size: 0; padding: 4px 2px; line-height: 1.2;
    }
    #listticket.compact #ticketcta::after {
      content: "GO! →"; font-size: 11px; font-weight: 900; letter-spacing: 0.4px;
    }
    #listticket.compact #eggbadge { display: none !important; }
    /* Cute golden-yellow clipboard top clip */
    .ticket-clip {
      position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
      width: 44px; height: 15px; border-radius: 6px 6px 3px 3px;
      background: linear-gradient(180deg, #ffe047, #f59e0b);
      border: 2.5px solid #0e1e36;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.6);
      z-index: 3;
    }
    .ticket-clip::after {
      content: ""; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
      width: 14px; height: 8px; border-radius: 999px 999px 0 0;
      border: 2.5px solid #0e1e36; border-bottom: 0; background: #fbbf24;
    }
    .ticket-head {
      background: linear-gradient(180deg, #ff9924, #f26400);
      border-radius: 9px 9px 0 0;
      padding: 8px 8px 10px;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      font-family: Impact, 'Arial Narrow', Arial, sans-serif;
      font-size: 13.5px; letter-spacing: .8px; color: #fff;
      text-shadow: 0 1.5px 0 rgba(14,30,54,.65);
      border-bottom: 2.5px solid #0e1e36;
      position: relative;
    }
    /* Metallic spiral notebook rings along header seam */
    .ticket-rings {
      position: absolute; left: 8px; right: 8px; bottom: -7px;
      display: flex; justify-content: space-between; pointer-events: none; z-index: 2;
    }
    .ticket-rings i {
      width: 7px; height: 12px; border-radius: 999px;
      background: linear-gradient(180deg, #f8fafc, #94a3b8);
      border: 1.8px solid #0e1e36; display: block;
    }
    #listbar {
      display: flex; flex-direction: column; gap: 4px;
      padding: 11px 9px 9px;
      background: repeating-linear-gradient(180deg, transparent 0 28px, rgba(148,163,184,.2) 28px 29px);
      border-radius: 0 0 9px 9px;
    }
    .chip {
      display: flex; align-items: center; gap: 7px;
      padding: 2px 3px; border-radius: 7px;
      transition: transform .18s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
    }
    .chip-ico { font-size: 20px; line-height: 1; flex: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.22)); }
    .chip-name {
      font-size: 13.5px; font-weight: 900; color: #0f172a; letter-spacing: .2px;
      flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chip-check {
      width: 20px; height: 20px; border-radius: 5px; flex: none;
      border: 2px solid #94a3b8; background: #fff;
      display: grid; place-items: center; font-size: 14px; font-weight: 900; color: transparent;
      transition: background .2s ease, border-color .2s ease, transform .24s cubic-bezier(.34,1.56,.64,1);
    }
    .chip-check svg { width: 15px; height: 15px; display: block; }
    .chip-check path {
      fill: none; stroke: #fff; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 28; stroke-dashoffset: 28;
    }
    .chip.done { opacity: .68; }
    .chip.done .chip-name { text-decoration: line-through; color: #64748b; }
    .chip.done .chip-check { background: #22c55e; border-color: #15803d; color: #fff; }
    .chip.done .chip-check path { stroke-dashoffset: 0; transition: stroke-dashoffset .34s cubic-bezier(.22,1,.36,1); }
    .chip.pop { animation: chip-pop .28s cubic-bezier(.34,1.56,.64,1); }
    @keyframes chip-pop { 0% { transform: scale(1); } 45% { transform: scale(1.14); } 100% { transform: scale(1); } }
    #listticket {
      transition: width .28s cubic-bezier(.22,1.2,.36,1), transform .32s cubic-bezier(.22,1.24,.36,1), box-shadow .35s ease;
    }
    #listticket.tut-showcase {
      z-index: 60;
      box-shadow: 0 10px 0 #0e1e36, 0 24px 60px rgba(0,0,0,.55), 0 0 0 6px rgba(255,224,102,.85);
    }
    #ticketcta {
      display: none; padding: 5px 6px 6px;
      background: #dcfce7; border-top: 2px dashed #22c55e; border-radius: 0 0 9px 9px;
      text-align: center; font-size: 10.5px; font-weight: 900; letter-spacing: .8px; color: #15803d;
    }
    #listticket.all-done { border-color: #16a34a; box-shadow: 0 5px 0 #15803d, 0 0 20px rgba(34,197,94,.45); }
    #listticket.all-done #ticketcta { display: block; }
    #listticket.goose-hunt {
      border-color: #d97706;
      box-shadow: 0 5px 0 #78350f, 0 0 22px rgba(250, 204, 21, 0.55);
    }
    #listticket.goose-hunt .ticket-head {
      background: linear-gradient(180deg, #fde047 0%, #f59e0b 100%);
      color: #451a03;
      text-shadow: 0 1px 0 rgba(255,255,255,.55);
    }
    .chip.chip--egg {
      background: linear-gradient(90deg, rgba(254, 240, 138, 0.88) 0%, rgba(253, 224, 71, 0.55) 100%);
      border: 1.8px solid #d97706;
      padding: 3px 4px;
      margin-top: 2px;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.45);
    }
    .chip.chip--egg .chip-name { color: #78350f; font-weight: 900; }
    .chip.chip--egg.done { opacity: 1; }
    .chip.chip--egg.done .chip-name { text-decoration: none; color: #78350f; }
    .chip.chip--egg.done .chip-check {
      background: linear-gradient(180deg, #fbbf24, #d97706);
      border-color: #78350f;
      color: #fff;
    }
    .chip.chip--egg.egg-flash {
      animation: eggRowPop .55s cubic-bezier(.18,1.5,.32,1);
    }
    @keyframes eggRowPop {
      0% { transform: scale(0.75); box-shadow: 0 0 0 rgba(250,204,21,0); }
      45% { transform: scale(1.16); box-shadow: 0 0 22px rgba(250,204,21,0.95); }
      100% { transform: scale(1); box-shadow: 0 0 10px rgba(250,204,21,0.45); }
    }
    #eggbadge {
      display: none; margin: 4px 7px 6px; padding: 4px 6px; border-radius: 9px;
      background: linear-gradient(180deg, #fde047 0%, #f59e0b 100%);
      border: 2px solid #78350f; color: #451a03; text-align: center;
      font: 900 10px/1.15 Impact, 'Arial Narrow', Arial, sans-serif; letter-spacing: 0.7px;
      box-shadow: 0 2px 0 #78350f, 0 0 12px rgba(250, 204, 21, 0.55);
      animation: eggPulse 0.9s ease-in-out infinite alternate;
    }
    #listticket.has-egg #eggbadge { display: block; }
    @keyframes eggPulse { from { transform: scale(1); } to { transform: scale(1.04); } }
    .fly-golden-egg {
      position: fixed; z-index: 62; pointer-events: none;
      display: grid; place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,251,210,0.95) 0%, rgba(253,224,71,0.68) 46%, rgba(245,158,11,0) 74%);
      filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.95)) drop-shadow(0 6px 12px rgba(0, 0, 0, 0.45));
      will-change: transform, opacity;
    }
    .egg-trolley-halo {
      position: fixed; z-index: 59; pointer-events: none;
      width: 96px; height: 96px; border-radius: 50%;
      border: 4px solid #fde047;
      box-shadow: 0 0 28px rgba(255, 215, 0, 0.95), inset 0 0 18px rgba(255, 240, 150, 0.75);
      transform: translate(-50%, -50%) scale(0.35);
      opacity: 0;
      will-change: transform, opacity;
    }

    /* Top-centre: Glossy Navy Stopwatch Bar with Lime-Green Fill (Artist Impression!) */
    #timerwrap {
      position: fixed; top: max(13px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      height: 36px; padding: 0 14px 0 38px; border-radius: 999px;
      background: linear-gradient(180deg, #1b3152 0%, #0d1c33 100%);
      border: 2.5px solid #081222;
      box-shadow: 0 4px 0 #081222, 0 7px 16px rgba(0,0,0,.32), inset 0 1.5px 0 rgba(255,255,255,.22);
      display: flex; align-items: center; gap: 10px; pointer-events: none; z-index: 20;
    }
    .timer-badge {
      position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(180deg, #d8ff36, #84cc16);
      border: 3px solid #081222;
      box-shadow: 0 3px 0 #081222, inset 0 2px 0 rgba(255,255,255,.65);
      display: grid; place-items: center;
    }
    .timer-badge svg { width: 24px; height: 24px; }
    #timerbar {
      width: min(176px, 32vw); height: 14px; border-radius: 999px;
      background: #94a3b8; border: 2px solid #081222; overflow: hidden;
      box-shadow: inset 0 2px 3px rgba(0,0,0,.35);
    }
    #timerfill {
      height: 100%; width: 100%; border-radius: 999px;
      background: linear-gradient(180deg, #d9ff3b, #84cc16);
      transition: width .1s linear;
    }
    #timerfill.mid { background: linear-gradient(180deg, #fde047, #f59e0b); }
    #timerfill.warn { background: linear-gradient(180deg, #ff6b6b, #dc2626); }
    #timertext {
      min-width: 28px; font-family: Impact, 'Arial Narrow', Arial, sans-serif;
      font-size: 20px; letter-spacing: .6px; color: #fff; text-align: right;
      text-shadow: 0 2px 0 #081222;
    }

    /* Top-right: Glossy Navy Coin Capsule with Oversized Goose Gold Coin (Artist Impression!) */
    #toprightbar {
      position: fixed; right: max(14px, env(safe-area-inset-right)); top: max(13px, env(safe-area-inset-top));
      display: flex; align-items: center; pointer-events: auto; z-index: 20;
    }
    #coinpill {
      position: relative; height: 38px; min-width: 106px;
      display: flex; align-items: center; justify-content: flex-end;
      background: linear-gradient(180deg, #1b3152 0%, #0d1c33 100%);
      border: 2.5px solid #081222; border-radius: 999px; padding: 0 16px 0 44px;
      box-shadow: 0 4px 0 #081222, 0 7px 16px rgba(0,0,0,.32), inset 0 0 0 2px rgba(255,255,255,.78);
      transition: transform .14s cubic-bezier(.34,1.56,.64,1);
    }
    #coinpill.coin-bump { animation: coin-pill-bump .26s cubic-bezier(.34,1.56,.64,1); }
    @keyframes coin-pill-bump { 0% { transform: scale(1); } 45% { transform: scale(1.16); } 100% { transform: scale(1); } }
    #coinpill img {
      position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px; object-fit: contain; display: block;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.45));
    }
    #coincount {
      font-family: Impact, 'Arial Narrow', Arial, sans-serif;
      font-size: 22px; letter-spacing: .8px; color: #fff;
      text-shadow: 0 2px 0 #081222;
    }

    @media (max-width: 560px) {
      #topleftbar { left: max(8px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); gap: 10px; }
      .tl-row { gap: 5px; }
      #pausebtn { width: 32px; height: 32px; border-radius: 10px; border-width: 2px; box-shadow: 0 3px 0 #081222; }
      #pausebtn svg { width: 14px; height: 14px; }
      #levelpill { height: 30px; padding: 0 8px; font-size: 13px; border-radius: 8px; border-width: 2px; box-shadow: 0 3px 0 #0b1628; }
      #timerwrap { top: max(10px, env(safe-area-inset-top)); left: 53%; height: 30px; padding: 0 8px 0 26px; gap: 5px; border-width: 2px; box-shadow: 0 3px 0 #081222; }
      .timer-badge { width: 30px; height: 30px; left: -6px; border-width: 2px; }
      .timer-badge svg { width: 17px; height: 17px; }
      #timerbar { width: 52px; height: 10px; border-width: 1.5px; }
      #timertext { min-width: 20px; font-size: 15px; }
      #toprightbar { right: max(8px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); }
      #coinpill { height: 30px; min-width: 68px; padding: 0 9px 0 30px; border-width: 2px; box-shadow: 0 3px 0 #081222, inset 0 0 0 1.5px rgba(255,255,255,.78); }
      #coinpill img { width: 34px; height: 34px; left: -8px; }
      #coincount { font-size: 15px; }
      #listticket { width: 144px; }
      #listticket.compact { width: 64px; }
      .chip-name { font-size: 11.5px; }
      #tutpill { top: auto !important; bottom: max(18px, env(safe-area-inset-bottom, 0px)) !important; font-size: 13px; padding: 7px 14px; }
    }

    .fly-icon {
      position: fixed; z-index: 40; pointer-events: none;
      font-size: 30px; line-height: 1; transform: translate(-50%,-50%);
      filter: drop-shadow(0 3px 4px rgba(0,0,0,.5));
      transition: transform .36s cubic-bezier(.3,.7,.4,1), opacity .36s ease;
    }
    .chip-ico { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; }
    .chip-ico-img { width: 24px; height: 24px; object-fit: contain; display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.22)); }
    .fly-icon img { width: 42px; height: 42px; object-fit: contain; display: block; filter: drop-shadow(0 4px 8px rgba(0,0,0,.38)); }
    .fly-coin {
      position: fixed; z-index: 50; width: 32px; height: 32px; object-fit: contain;
      pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,.4));
    }
    .coin-float-pop {
      position: fixed; z-index: 55; pointer-events: none;
      transform: translate(-50%, -50%);
      font-family: Impact, 'Arial Narrow', Arial, sans-serif;
      font-size: clamp(40px, 6.2vw, 48px); letter-spacing: 1.2px; color: #ffe066;
      -webkit-text-stroke: 2.4px var(--navy);
      text-shadow: 0 5px 0 var(--navy), 0 10px 20px rgba(0,0,0,.5);
      animation: float-pop-up .92s cubic-bezier(.16,1,.3,1) forwards;
    }
    @keyframes float-pop-up {
      0%   { opacity: 0; transform: translate(-50%, -15%) scale(.45) rotate(0deg); }
      18%  { opacity: 1; transform: translate(-50%, -82%) scale(1.26) rotate(-7deg); }
      28%  { opacity: 1; transform: translate(-46%, -88%) scale(1.22) rotate(7deg); }
      38%  { opacity: 1; transform: translate(-54%, -94%) scale(1.16) rotate(-5deg); }
      48%  { opacity: 1; transform: translate(-48%, -100%) scale(1.10) rotate(4deg); }
      58%  { opacity: 1; transform: translate(-50%, -108%) scale(1.04) rotate(0deg); }
      78%  { opacity: 1; transform: translate(-50%, -138%) scale(1.0) rotate(0deg); }
      100% { opacity: 0; transform: translate(-50%, -178%) scale(.88) rotate(0deg); }
    }

    /* Goose dodge / telegraph sticker callouts */
    .goose-callout {
      position: fixed; z-index: 58; pointer-events: none;
      transform: translate(-50%, -50%);
      font-family: Impact, 'Arial Narrow', Arial, sans-serif;
      font-size: 26px; letter-spacing: 1.5px; white-space: nowrap;
      padding: 4px 12px; border-radius: 999px;
      border: 3px solid var(--navy);
      box-shadow: 0 4px 0 var(--navy), 0 8px 16px rgba(0,0,0,.35);
      -webkit-text-stroke: 1.4px var(--navy);
      text-shadow: 0 2px 0 var(--navy);
      animation: goose-callout-pop 0.92s cubic-bezier(.18,1.35,.32,1) forwards;
    }
    .goose-callout--dodge {
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      color: #fff7cc;
    }
    .goose-callout--open {
      background: linear-gradient(180deg, #4ade80, #16a34a);
      color: #fef08a;
      font-size: 29px;
    }
    .goose-callout--perched {
      background: linear-gradient(180deg, #f8fafc, #cbd5e1);
      color: #ffdd44;
    }
    @keyframes goose-callout-pop {
      0% { opacity: 0; transform: translate(-50%, -15%) scale(.45) rotate(-8deg); }
      20% { opacity: 1; transform: translate(-50%, -85%) scale(1.16) rotate(3deg); }
      38% { opacity: 1; transform: translate(-50%, -105%) scale(1.0) rotate(-2deg); }
      78% { opacity: 1; transform: translate(-50%, -135%) scale(.98) rotate(0deg); }
      100% { opacity: 0; transform: translate(-50%, -175%) scale(.88) rotate(2deg); }
    }

    /* Goose alert banner */
    #goosebanner {
      position: fixed; top: 23%; left: 50%; transform: translate(-50%,-50%) scale(.5);
      font-family: Impact, 'Arial Narrow', Arial, sans-serif; font-size: clamp(32px, 7.2vw, 56px);
      letter-spacing: 3px; color: var(--gold); -webkit-text-stroke: 2.2px var(--navy);
      text-shadow: 0 5px 0 var(--navy), 0 10px 22px rgba(0,0,0,.5);
      opacity: 0; pointer-events: none; white-space: nowrap;
    }
    #goosebanner.show { animation: goose-banner 1.15s cubic-bezier(.18,1.35,.35,1) both; }
    @keyframes goose-banner {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.4) rotate(-6deg); }
      18% { opacity: 1; transform: translate(-50%,-50%) scale(1.1) rotate(2deg); }
      30% { transform: translate(-50%,-50%) scale(1) rotate(-1deg); }
      75% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%,-60%) scale(1.05); }
    }

    #joybase {
      position: fixed; width: 110px; height: 110px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.45); background: rgba(16,24,32,.35);
      display: none; pointer-events: none; transform: translate(-50%,-50%);
    }
    #joyknob {

    /* First-arrival seamless intact -> silky smooth tremble -> 6-shard + black & gold sparkle explosion */
    .brand-reveal {
      position: fixed; inset: 0; z-index: 45; pointer-events: none;
      display: grid; place-items: center; overflow: hidden;
      background: radial-gradient(ellipse at center, rgba(10, 18, 34, 0.56), transparent 72%);
      will-change: opacity;
      animation: brand-clear 2.25s cubic-bezier(.4, 0, .2, 1) both;
    }
    .brand-reveal[hidden] { display: none; }
    .brand-pieces {
      position: relative; width: min(56vmin, 380px); aspect-ratio: 706 / 777;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      animation: brand-arrive-shake 1.50s linear forwards;
    }
    .brand-pieces img.brand-whole {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.5));
      will-change: opacity;
      animation: brand-whole-swap 1.50s linear forwards;
    }
    .brand-pieces img.brand-shard {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
      opacity: 0; visibility: hidden;
      will-change: transform, opacity;
      animation: brand-shard .72s 1.50s cubic-bezier(.16, 1, .3, 1) forwards;
    }
    .brand-core-flash {
      position: absolute; left: 50%; top: 50%;
      width: min(36vmin, 240px); height: min(36vmin, 240px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 250, 215, 0.88) 0%, rgba(255, 212, 68, 0.62) 38%, rgba(12, 16, 26, 0.32) 66%, transparent 76%);
      transform: translate3d(-50%, -50%, 0) scale(0);
      opacity: 0; visibility: hidden;
      will-change: transform, opacity;
      animation: brand-core-flash .32s 1.50s cubic-bezier(.16, 1, .3, 1) forwards;
    }
    .brand-sparkle {
      position: absolute; left: 50%; top: 50%;
      width: var(--sp-size, 14px); height: var(--sp-size, 14px);
      background: var(--sp-bg);
      clip-path: var(--sp-clip);
      filter: var(--sp-glow);
      transform: translate3d(calc(-50% + var(--sp-start-x, 0px)), calc(-50% + var(--sp-start-y, 0px)), 0) scale(0);
      opacity: 0; visibility: hidden;
      will-change: transform, opacity;
      animation: brand-sparkle .72s 1.50s cubic-bezier(.16, 1, .3, 1) forwards;
    }
    @keyframes brand-arrive-shake {
      0%   { transform: translate3d(0, 0, 0) scale(.76) rotate(-1.5deg); opacity: 0; animation-timing-function: cubic-bezier(.22, 1.22, .36, 1); }
      20%  { transform: translate3d(0, 0, 0) scale(1.03) rotate(.5deg); opacity: 1; animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
      32%  { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); opacity: 1; }
      68%  { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); opacity: 1; animation-timing-function: ease-in-out; }
      72%  { transform: translate3d(-2px, 1px, 0) scale(1.01) rotate(-.8deg); opacity: 1; animation-timing-function: ease-in-out; }
      76%  { transform: translate3d(2.5px, -1.5px, 0) scale(1.02) rotate(.9deg); opacity: 1; animation-timing-function: ease-in-out; }
      80%  { transform: translate3d(-3px, -1.5px, 0) scale(1.03) rotate(-1.2deg); opacity: 1; animation-timing-function: ease-in-out; }
      84%  { transform: translate3d(3.5px, 2px, 0) scale(1.04) rotate(1.4deg); opacity: 1; animation-timing-function: ease-in-out; }
      88%  { transform: translate3d(-4px, 1.5px, 0) scale(1.055) rotate(-1.7deg); opacity: 1; animation-timing-function: ease-in-out; }
      92%  { transform: translate3d(4.5px, -2px, 0) scale(1.07) rotate(1.9deg); opacity: 1; animation-timing-function: ease-in-out; }
      96%  { transform: translate3d(-3px, 1px, 0) scale(1.085) rotate(-1.1deg); opacity: 1; animation-timing-function: ease-out; }
      100% { transform: translate3d(0, 0, 0) scale(1.10) rotate(0deg); opacity: 1; }
    }
    @keyframes brand-whole-swap {
      0%, 99.2% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; }
    }
    @keyframes brand-shard {
      0% { visibility: visible; transform: translate3d(0, 0, 0) rotate(0deg) scale(1); opacity: 1; }
      22% { opacity: 1; }
      100% { visibility: visible; transform: translate3d(var(--burst-x), var(--burst-y), 0) rotate(var(--burst-turn)) scale(.74); opacity: 0; }
    }
    @keyframes brand-core-flash {
      0% { visibility: visible; transform: translate3d(-50%, -50%, 0) scale(.3); opacity: .88; }
      28% { opacity: .82; transform: translate3d(-50%, -50%, 0) scale(1.12); }
      100% { visibility: visible; transform: translate3d(-50%, -50%, 0) scale(1.65); opacity: 0; }
    }
    @keyframes brand-sparkle {
      0% { visibility: visible; transform: translate3d(calc(-50% + var(--sp-start-x, 0px)), calc(-50% + var(--sp-start-y, 0px)), 0) scale(.42) rotate(0deg); opacity: 1; }
      22% { opacity: 1; transform: translate3d(calc(-50% + var(--sp-mid-x)), calc(-50% + var(--sp-mid-y)), 0) scale(1.18) rotate(var(--sp-rot-mid)); }
      62% { opacity: 1; }
      100% { visibility: visible; transform: translate3d(calc(-50% + var(--sp-x)), calc(-50% + var(--sp-y)), 0) scale(.18) rotate(var(--sp-rot)); opacity: 0; }
    }
    @keyframes brand-clear { 0%, 74% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .brand-pieces { animation: none; }
      .brand-pieces img.brand-whole { animation: brand-clear .5s 1.2s both; }
